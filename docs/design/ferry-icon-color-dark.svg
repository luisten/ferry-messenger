<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Ferry app icon: Two aboard, Deep water (dark)</title>
  <!-- Dark appearance, round 2 (2026-10-15). Transparent background: iOS draws its own dark backdrop behind it.
       As in Apple's own dark icons, the colour moves from the tile to the glyph: the ferry and the wave take the sea's
       colour (brightened for a dark backdrop), the bubbles stay white and foam. Four fills here, not two: the hull no
       longer matches the front bubble.
       Geometry is identical to ferry-icon-color.svg. Render rules for CoreGraphics (top-left origin, 1 unit = 1 px of
       the 1024 artboard): only M, H, V, C, Z; absolute coordinates; every path is one closed outline filled nonzero;
       the wave is a stroke (width 36, round caps, round joins). Draw in this order. -->
  <!-- 2. Back bubble (second account): foam, dimmed for the dark backdrop. 9.5:1 on #1C1C1E. -->
  <path d="M650 216 H722 C766.2 216 802 251.8 802 296 V316 C802 368 795.2 402.1 815.6 436.8 C785.7 418.4 727.2 396 666 396 H650 C605.8 396 570 360.2 570 316 V296 C570 251.8 605.8 216 650 216Z" fill="#8FCBD9"/>
  <!-- 3. Front bubble (first account): near white. -->
  <path d="M306 252 H430 C485.2 252 530 296.8 530 352 V384 C530 439.2 485.2 484 430 484 H376 C299.5 484 226.4 512 189 535 C214.5 491.6 206 449 206 384 V352 C206 296.8 250.8 252 306 252Z" fill="#F4F9FA"/>
  <!-- 4. Hull: bright sea. 5.4:1 on #1C1C1E. -->
  <path d="M162 572 H862 C836 614 808 654 784 684 C776 694 766 700 752 700 H250 C208 700 178 648 162 572Z" fill="#2F9CC5"/>
  <!-- 5. Wave: bright sea, like the hull. -->
  <path d="M242 794 C291.5 772.7 328.5 772.7 378 794 C427.5 815.3 464.5 815.3 514 794 C563.5 772.7 600.5 772.7 650 794 C699.5 815.3 736.5 815.3 786 794" fill="none" stroke="#2F9CC5" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
