<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Ferry app icon: Two aboard (light)</title>
  <!-- Default (light) appearance. Opaque: the background gradient fills the whole square (no alpha in the PNG).
       Concept "Two aboard": a ferry (raked bow to the right, the direction of travel) carrying two speech bubbles side
       by side, never overlapping (several accounts, one boat), over one wave. Monochrome like the app chrome: colour
       means account (DESIGN 0.1), so the icon has none.
       Render rules for CoreGraphics (top-left origin, 1 unit = 1 px of the 1024 artboard): only M, H, V, L, C, Q, Z;
       absolute coordinates; every path is one closed outline filled nonzero (bubble and tail are a single outline, so
       no seams); the wave is a stroke (width 36, round caps, round joins). Draw in this order. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E8ED"/>
    </linearGradient>
  </defs>
  <!-- 1. Background: vertical gradient, top #FFFFFF to bottom #E8E8ED. iOS applies the corner mask. -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <!-- 2. Back bubble (second account): 232 x 180 at (570, 216), corner radius 80, tail at the bottom right. -->
  <path d="M650 216 H722 C766.2 216 802 251.8 802 296 V316 C802 368 795.2 402.1 815.6 436.8 C785.7 418.4 727.2 396 666 396 H650 C605.8 396 570 360.2 570 316 V296 C570 251.8 605.8 216 650 216Z" fill="#8E8E95"/>
  <!-- 3. Front bubble (first account): 324 x 232 at (206, 252), corner radius 100, tail at the bottom left. -->
  <path d="M306 252 H430 C485.2 252 530 296.8 530 352 V384 C530 439.2 485.2 484 430 484 H376 C299.5 484 226.4 512 189 535 C214.5 491.6 206 449 206 384 V352 C206 296.8 250.8 252 306 252Z" fill="#16161A"/>
  <!-- 4. Hull: deck y 572 from x 162 to 862, keel y 700, raked bow on the right (slightly hollow, soft at the keel), rounded stern on the left. -->
  <path d="M162 572 H862 C836 614 808 654 784 684 C776 694 766 700 752 700 H250 C208 700 178 648 162 572Z" fill="#16161A"/>
  <!-- 5. Wave: two full periods from x 242 to 786 around y 794, amplitude 16 (cubic sine approximation). -->
  <path d="M242 794 C291.5 772.7 328.5 772.7 378 794 C427.5 815.3 464.5 815.3 514 794 C563.5 772.7 600.5 772.7 650 794 C699.5 815.3 736.5 815.3 786 794" fill="none" stroke="#8E8E95" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
